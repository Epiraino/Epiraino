<title>Gametime Draft Kit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* ============ TOKENS — dark-first (draft night) ============ */
:root {
  --bg: #0E1411;
  --surface: #161E19;
  --surface2: #1D2720;
  --line: #27332B;
  --ink: #E9EFE9;
  --muted: #93A398;
  --accent: #F0B440;
  --on-accent: #1A1206;
  --accent-strong: #F5C765;
  --danger: #E5645A;
  --good: #57C785;
  --strike: #5C6A60;
  --qb: #C495F5; --rb: #5BD08B; --wr: #6FB3F7; --te: #F2A15C; --k: #9FB0BC; --def: #C29A76;
  --qb-bg: rgba(196,149,245,.14); --rb-bg: rgba(91,208,139,.13); --wr-bg: rgba(111,179,247,.13);
  --te-bg: rgba(242,161,92,.14); --k-bg: rgba(159,176,188,.13); --def-bg: rgba(194,154,118,.14);
  --shadow: 0 2px 10px rgba(0,0,0,.35);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F6F7F4;
    --surface: #FFFFFF;
    --surface2: #ECEFEA;
    --line: #DCE2DB;
    --ink: #1B231D;
    --muted: #5C6A60;
    --accent: #E7AC2F;
    --on-accent: #201607;
    --accent-strong: #8A6210;
    --danger: #C0392F;
    --good: #1F8A4C;
    --strike: #9AA79E;
    --qb: #7C3AED; --rb: #15803D; --wr: #1D4ED8; --te: #C2600E; --k: #475569; --def: #8B5E34;
    --qb-bg: rgba(124,58,237,.09); --rb-bg: rgba(21,128,61,.09); --wr-bg: rgba(29,78,216,.09);
    --te-bg: rgba(194,96,14,.10); --k-bg: rgba(71,85,105,.09); --def-bg: rgba(139,94,52,.11);
    --shadow: 0 1px 6px rgba(27,35,29,.10);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #F6F7F4;
  --surface: #FFFFFF;
  --surface2: #ECEFEA;
  --line: #DCE2DB;
  --ink: #1B231D;
  --muted: #5C6A60;
  --accent: #E7AC2F;
  --on-accent: #201607;
  --accent-strong: #8A6210;
  --danger: #C0392F;
  --good: #1F8A4C;
  --strike: #9AA79E;
  --qb: #7C3AED; --rb: #15803D; --wr: #1D4ED8; --te: #C2600E; --k: #475569; --def: #8B5E34;
  --qb-bg: rgba(124,58,237,.09); --rb-bg: rgba(21,128,61,.09); --wr-bg: rgba(29,78,216,.09);
  --te-bg: rgba(194,96,14,.10); --k-bg: rgba(71,85,105,.09); --def-bg: rgba(139,94,52,.11);
  --shadow: 0 1px 6px rgba(27,35,29,.10);
  color-scheme: light;
}

/* ============ BASE ============ */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px;
}
input { font: inherit; color: var(--ink); }
h1, h2, h3 { margin: 0; }
.disp { font-family: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif; }
.num { font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

/* ============ SHELL ============ */
#app { min-height: 100vh; display: flex; flex-direction: column; }
#main { flex: 1; width: 100%; max-width: 1280px; margin: 0 auto; padding: 10px 10px 76px; }
.view { display: none; }
.view.active { display: block; }

/* ============ HEADER ============ */
#hdr {
  position: sticky; top: 0; z-index: 20;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.hdr-inner { max-width: 1280px; margin: 0 auto; padding: 8px 10px 6px; }
.hdr-top { display: flex; align-items: center; gap: 10px; }
.brand {
  font-family: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  font-weight: 700; font-size: 21px; letter-spacing: .04em; white-space: nowrap;
}
.brand small { color: var(--accent-strong); font-weight: 600; letter-spacing: .1em; }
#pickTracker {
  flex: 1; min-width: 0; text-align: center;
  font-family: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  font-weight: 600; font-size: 16px; letter-spacing: .03em; color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#pickTracker .up-now { color: var(--accent-strong); }
#undoBtn {
  padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); font-weight: 600; font-size: 13px; min-height: 36px;
}
#undoBtn:disabled { opacity: .4; cursor: default; }
.hdr-controls { display: flex; gap: 6px; margin-top: 7px; align-items: center; flex-wrap: wrap; }
#search {
  flex: 1 1 130px; min-width: 110px; padding: 8px 12px; border-radius: 9px;
  border: 1px solid var(--line); background: var(--surface);
}
#search::placeholder { color: var(--muted); }
.chips { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); font-size: 12.5px; font-weight: 600; min-height: 32px;
  color: var(--muted); white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.hide-toggle {
  display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600;
  color: var(--muted); cursor: pointer; white-space: nowrap; padding: 6px 4px;
}
.hide-toggle input { accent-color: var(--accent); width: 15px; height: 15px; }

/* ============ BANNERS ============ */
.banner {
  max-width: 1280px; margin: 8px auto 0; padding: 8px 12px; border-radius: 9px;
  font-size: 13px; font-weight: 600;
}
.banner.warn { background: var(--danger); color: #fff; }
.banner.info { background: var(--surface2); color: var(--muted); border: 1px solid var(--line); }

/* ============ BOARD ============ */
.tier-label {
  display: flex; align-items: baseline; gap: 8px; margin: 16px 2px 6px;
  font-family: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  font-weight: 700; font-size: 15px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--accent-strong);
}
.tier-label .tl-note { font-family: inherit; font-weight: 500; color: var(--muted); letter-spacing: .02em; text-transform: none; font-size: 14px; }
.tier-label::after { content: ""; flex: 1; height: 1px; background: var(--line); align-self: center; }
.prow {
  display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 9px; margin-bottom: 5px; min-height: 52px;
  transition: opacity .12s, background .12s;
}
.prow:active { background: var(--surface2); }
.prow .rk {
  width: 32px; flex: none; text-align: center; font-weight: 700; font-size: 15px;
  color: var(--muted);
}
.pos-badge {
  flex: none; width: 46px; text-align: center; padding: 3px 0; border-radius: 6px;
  font-size: 11.5px; font-weight: 700; letter-spacing: .02em;
}
.pos-QB { color: var(--qb); background: var(--qb-bg); }
.pos-RB { color: var(--rb); background: var(--rb-bg); }
.pos-WR { color: var(--wr); background: var(--wr-bg); }
.pos-TE { color: var(--te); background: var(--te-bg); }
.pos-K  { color: var(--k);  background: var(--k-bg); }
.pos-DEF{ color: var(--def);background: var(--def-bg); }
.prow .pinfo { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.prow .pname { font-weight: 650; font-size: 15px; display: flex; align-items: center; gap: 6px; }
.prow .pname .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow .pmeta { display: block; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.inj-dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }
.badge {
  flex: none; font-size: 10.5px; font-weight: 700; letter-spacing: .04em;
  padding: 2px 6px; border-radius: 5px;
}
.badge.value { color: var(--good); border: 1px solid var(--good); }
.badge.warnb { color: var(--danger); border: 1px solid var(--danger); }
.mine-btn {
  flex: none; padding: 9px 12px; border-radius: 8px; min-height: 40px;
  background: var(--accent); color: var(--on-accent);
  font-weight: 800; font-size: 13px; letter-spacing: .03em;
}
.prow.gone { opacity: .5; min-height: 34px; padding: 4px 9px; background: transparent; }
.prow.gone .pname, .prow.gone .pmeta { text-decoration: line-through; color: var(--strike); }
.prow.gone .rk { color: var(--strike); }
.prow.gone .mine-btn { display: none; }
.prow.gone .pos-badge { opacity: .55; }
.prow.mine-row { border-color: var(--accent); background: var(--surface); }
.prow.mine-row .mine-btn { background: var(--surface2); color: var(--accent-strong); }
.empty-note { color: var(--muted); text-align: center; padding: 30px 10px; }

/* ============ ROSTER ============ */
.roster-grid { display: flex; flex-direction: column; gap: 5px; }
.rslot {
  display: flex; align-items: center; gap: 9px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-height: 48px;
}
.rslot .slot-key {
  flex: none; width: 44px; text-align: center; font-family: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  font-weight: 700; font-size: 14px; letter-spacing: .05em; color: var(--muted);
}
.rslot.filled .slot-key { color: var(--accent-strong); }
.rslot .slot-player { flex: 1; min-width: 0; }
.rslot .slot-empty { color: var(--muted); font-size: 13.5px; }
.rslot .drop-btn { flex: none; padding: 6px 10px; border-radius: 7px; border: 1px solid var(--line); font-size: 12px; font-weight: 600; color: var(--muted); min-height: 34px; }
.hint-box { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.hint {
  padding: 8px 12px; border-radius: 9px; background: var(--surface2);
  border: 1px solid var(--line); font-size: 13px; color: var(--muted);
}
.hint.alert { color: var(--danger); border-color: var(--danger); font-weight: 600; }
.copy-btn {
  margin-top: 14px; width: 100%; padding: 12px; border-radius: 10px;
  background: var(--surface); border: 1px solid var(--accent); color: var(--accent-strong);
  font-weight: 700; letter-spacing: .02em; min-height: 46px;
}

/* ============ STRATEGY ============ */
.slot-picker { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin: 10px 0 4px; }
.slot-btn {
  padding: 12px 0; border-radius: 9px; border: 1px solid var(--line); background: var(--surface);
  font-family: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  font-weight: 700; font-size: 18px; min-height: 46px;
}
.slot-btn[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.pick-strip { display: flex; flex-wrap: wrap; gap: 5px; margin: 12px 0; }
.pick-pill {
  padding: 4px 9px; border-radius: 7px; background: var(--surface2); border: 1px solid var(--line);
  font-size: 12.5px; font-weight: 600; color: var(--muted);
}
.pick-pill b { color: var(--ink); }
.round-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 12px; margin-bottom: 7px;
}
.round-card .rc-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 3px; }
.round-card .rc-round {
  font-family: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  font-weight: 700; font-size: 16px; letter-spacing: .04em; color: var(--accent-strong);
}
.round-card .rc-pick { font-size: 12px; color: var(--muted); font-weight: 600; }
.round-card .rc-advice { font-size: 13.5px; }
.round-card .rc-avail { font-size: 12.5px; color: var(--muted); margin-top: 5px; }
.round-card .rc-avail b { color: var(--ink); font-weight: 600; }

/* ============ SHEETS / ACCORDIONS ============ */
details.acc { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 7px; overflow: hidden; }
details.acc summary {
  cursor: pointer; padding: 12px 14px; list-style: none; display: flex; align-items: center; gap: 8px;
  font-family: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  font-weight: 700; font-size: 17px; letter-spacing: .05em;
}
details.acc summary::-webkit-details-marker { display: none; }
details.acc summary::after { content: "+"; margin-left: auto; color: var(--muted); font-size: 18px; }
details.acc[open] summary::after { content: "–"; }
details.acc .acc-body { padding: 0 14px 12px; }
.sheet-item { padding: 7px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.sheet-item:first-child { border-top: none; }
.sheet-item .si-name { font-weight: 650; }
.sheet-item .si-why { color: var(--muted); font-size: 12.5px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; color: var(--muted); font-weight: 600; padding: 5px 8px; border-bottom: 1px solid var(--line); font-size: 12px; }
.tbl td { padding: 6px 8px; border-bottom: 1px solid var(--line); }
.tbl-wrap { overflow-x: auto; }
.bye-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px; }
.bye-cell { background: var(--surface2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; font-size: 12.5px; }
.bye-cell .bw { font-weight: 700; color: var(--accent-strong); }
.bye-cell .teams { color: var(--muted); }
.bye-cell .mine-team { color: var(--ink); font-weight: 700; }

/* ============ LEAGUE ============ */
.league-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
.league-card h3 {
  font-family: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  font-weight: 700; font-size: 17px; letter-spacing: .05em; margin-bottom: 8px;
}
.league-card ul { margin: 6px 0 0; padding-left: 20px; font-size: 13.5px; }
.league-card li { margin-bottom: 5px; }
.stamp { font-size: 12px; color: var(--muted); }
.reset-btn {
  width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--danger);
  color: var(--danger); font-weight: 700; margin-top: 6px; min-height: 46px;
}

/* ============ SECTION HEADS ============ */
.sec-head {
  font-family: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  font-weight: 700; font-size: 20px; letter-spacing: .06em; text-transform: uppercase;
  margin: 8px 2px 10px; text-wrap: balance;
}
.sec-sub { color: var(--muted); font-size: 13px; margin: -6px 2px 12px; }

/* ============ TAB BAR ============ */
#tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
  display: flex; background: var(--surface);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
.tab-btn {
  flex: 1; padding: 9px 2px 8px; text-align: center; color: var(--muted);
  font-size: 11px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 2px;
  min-height: 52px;
}
.tab-btn svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab-btn[aria-pressed="true"] { color: var(--accent-strong); }
#toast {
  position: fixed; bottom: 72px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 999px;
  font-size: 13px; font-weight: 600; box-shadow: var(--shadow); z-index: 30;
  transition: opacity .15s;
}

/* narrow phones: the pick tracker matters more than the wordmark */
@media (max-width: 480px) {
  .brand { font-size: 18px; }
  .brand small { display: none; }
  #pickTracker { text-align: right; font-size: 15px; }
}

/* ============ DESKTOP ============ */
#sidebar { display: none; }
@media (min-width: 1024px) {
  #main { display: grid; grid-template-columns: 1fr 350px; gap: 18px; padding: 14px 16px 30px; align-items: start; }
  #views { min-width: 0; }
  #sidebar { display: block; position: sticky; top: 118px; }
  #sidebar .sec-head { font-size: 17px; margin-top: 0; }
  #tabbar {
    position: static; border-top: none; background: transparent; padding: 0;
    max-width: 1280px; margin: 6px auto 0; gap: 6px; padding: 0 16px;
  }
  .tab-btn {
    flex: none; flex-direction: row; gap: 7px; font-size: 13px; padding: 8px 14px;
    border: 1px solid var(--line); border-radius: 9px; background: var(--surface); min-height: 38px;
  }
  .tab-btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  #main { padding-bottom: 40px; }
  #toast { bottom: 30px; }
}
</style>

<div id="app">

    <div class="hdr-inner">
      <div class="hdr-top">

</div>

<script>
(function () {
  "use strict";
  var D = window.DK_DATA;
  var TEAMS = 12, ROUNDS = 15;
  var STORE_KEY = "gametime-draftkit-v1";
  var POS_ORDER = ["ALL", "QB", "RB", "WR", "TE", "FLX", "K", "DEF"];
  var SLOT_DEFS = [
    { key: "QB",  label: "QB",  accepts: ["QB"] },
    { key: "WR1", label: "WR",  accepts: ["WR"] },
    { key: "WR2", label: "WR",  accepts: ["WR"] },
    { key: "RB1", label: "RB",  accepts: ["RB"] },
    { key: "RB2", label: "RB",  accepts: ["RB"] },
    { key: "TE",  label: "TE",  accepts: ["TE"] },
    { key: "FLX", label: "FLX", accepts: ["WR", "RB", "TE"] },
    { key: "K",   label: "K",   accepts: ["K"] },
    { key: "DEF", label: "DEF", accepts: ["DEF"] },
    { key: "BN1", label: "BN",  accepts: ["QB", "WR", "RB", "TE", "K", "DEF"] },
    { key: "BN2", label: "BN",  accepts: ["QB", "WR", "RB", "TE", "K", "DEF"] },
    { key: "BN3", label: "BN",  accepts: ["QB", "WR", "RB", "TE", "K", "DEF"] },
    { key: "BN4", label: "BN",  accepts: ["QB", "WR", "RB", "TE", "K", "DEF"] },
    { key: "BN5", label: "BN",  accepts: ["QB", "WR", "RB", "TE", "K", "DEF"] },
    { key: "BN6", label: "BN",  accepts: ["QB", "WR", "RB", "TE", "K", "DEF"] }
  ];
  var TABS = [
    { key: "board",    label: "Board",    icon: "M4 6h16M4 12h16M4 18h10" },
    { key: "roster",   label: "Roster",   icon: "M12 3l2.5 5 5.5.8-4 3.9.9 5.5-4.9-2.6-4.9 2.6.9-5.5-4-3.9 5.5-.8z" },
    { key: "strategy", label: "Strategy", icon: "M9 20H5a1 1 0 01-1-1v-5h5v6zm5.5 0h-5v-9h5v9zM20 20h-4v-13h4a1 1 0 011 1v11a1 1 0 01-1 1z" },
    { key: "sheets",   label: "Sheets",   icon: "M7 3h10a2 2 0 012 2v14a2 2 0 01-2 2H7a2 2 0 01-2-2V5a2 2 0 012-2zm2 5h6M9 12h6M9 16h4" },
    { key: "league",   label: "League",   icon: "M12 8a4 4 0 100 8 4 4 0 000-8zm8.5 4l1.5-1-1-3-1.8.3a8 8 0 00-1.4-1.4L18 5l-3-1-1 1.5a8 8 0 00-2 0L11 4 8 5l.2 1.9A8 8 0 006.8 8.3L5 8l-1 3 1.5 1L4 13l1 3 1.8-.3a8 8 0 001.4 1.4L8 19l3 1 1-1.5a8 8 0 002 0L15 20l3-1-.2-1.9a8 8 0 001.4-1.4l1.8.3 1-3-1.5-1z" }
  ];

  /* ---------- state ---------- */
  var state = {
    view: "board",
    slot: null,
    drafted: {},          // id -> "gone" | "mine"
    mineOrder: [],        // ids in the order I drafted them
    posFilter: "ALL",
    search: "",
    hideDrafted: false,
    undoStack: []         // [{id, prev, prevMineIdx}]
  };
  var storageOk = true;

  function loadState() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        var s = JSON.parse(raw);
        if (s && typeof s === "object") {
          state.slot = s.slot || null;
          state.drafted = s.drafted || {};
          state.mineOrder = s.mineOrder || [];
          state.hideDrafted = !!s.hideDrafted;
          state.posFilter = s.posFilter || "ALL";
          state.view = s.view || "board";
        }
      }
      localStorage.setItem(STORE_KEY + ":probe", "1");
      localStorage.removeItem(STORE_KEY + ":probe");
    } catch (e) { storageOk = false; }
  }
  function saveState() {
    if (!storageOk) return;
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        slot: state.slot, drafted: state.drafted, mineOrder: state.mineOrder,
        hideDrafted: state.hideDrafted, posFilter: state.posFilter, view: state.view
      }));
    } catch (e) { storageOk = false; showStorageBanner(); }
  }
  function showStorageBanner() {
    document.getElementById("storageBanner").hidden = storageOk;
  }

  /* ---------- helpers ---------- */
  var byId = {};
  D.players.forEach(function (p) { byId[p.id] = p; });

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function picksForSlot(s) {
    var out = [];
    for (var r = 1; r <= ROUNDS; r++) {
      out.push(r % 2 === 1 ? (r - 1) * TEAMS + s : r * TEAMS - s + 1);
    }
    return out;
  }
  function draftedCount() { return Object.keys(state.drafted).length; }
  function currentPick() { return draftedCount() + 1; }

  function markPlayer(id, mark) {
    var prev = state.drafted[id];
    if (prev === mark) return;
    var prevMineIdx = state.mineOrder.indexOf(id);
    state.undoStack.push({ id: id, prev: prev || null, prevMineIdx: prevMineIdx });
    if (state.undoStack.length > 30) state.undoStack.shift();
    if (prevMineIdx !== -1) state.mineOrder.splice(prevMineIdx, 1);
    if (mark === null) { delete state.drafted[id]; }
    else {
      state.drafted[id] = mark;
      if (mark === "mine") state.mineOrder.push(id);
    }
    saveState();
    renderDynamic();
  }
  function undo() {
    var a = state.undoStack.pop();
    if (!a) return;
    var curIdx = state.mineOrder.indexOf(a.id);
    if (curIdx !== -1) state.mineOrder.splice(curIdx, 1);
    if (a.prev === null) { delete state.drafted[a.id]; }
    else {
      state.drafted[a.id] = a.prev;
      if (a.prev === "mine") {
        if (a.prevMineIdx >= 0 && a.prevMineIdx <= state.mineOrder.length) state.mineOrder.splice(a.prevMineIdx, 0, a.id);
        else state.mineOrder.push(a.id);
      }
    }
    saveState();
    renderDynamic();
    toast("Undone");
  }
  function resetDraft() {
    if (!confirm("Reset the draft? This clears every mark and your roster.")) return;
    state.drafted = {}; state.mineOrder = []; state.undoStack = [];
    saveState();
    renderDynamic();
    toast("Draft reset");
  }

  function computeRoster() {
    var slots = SLOT_DEFS.map(function (d) { return { def: d, player: null }; });
    state.mineOrder.forEach(function (id) {
      var p = byId[id];
      if (!p) return;
      for (var i = 0; i < slots.length; i++) {
        if (!slots[i].player && slots[i].def.accepts.indexOf(p.pos) !== -1) { slots[i].player = p; return; }
      }
    });
    return slots;
  }
  function rosterNeeds(slots) {
    var need = [];
    slots.forEach(function (s) {
      if (!s.player && ["QB", "WR1", "WR2", "RB1", "RB2", "TE", "FLX", "K", "DEF"].indexOf(s.def.key) !== -1) {
        need.push(s.def.label === "FLX" ? "FLEX" : s.def.label);
      }
    });
    return need;
  }

  var toastTimer = null;
  function toast(msg) {
    var t = document.getElementById("toast");
    if (!t) {
      t = document.createElement("div");
      t.id = "toast";
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = "1";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.style.opacity = "0"; }, 1400);
  }

  /* ---------- render: header ---------- */
  function renderTracker() {
    var el = document.getElementById("pickTracker");
    var cp = currentPick();
    var total = TEAMS * ROUNDS;
    if (cp > total) { el.textContent = "Draft complete"; return; }
    var round = Math.ceil(cp / TEAMS);
    var txt = "~P" + cp + " · R" + round;
    if (state.slot) {
      var mine = picksForSlot(state.slot);
      var next = null;
      for (var i = 0; i < mine.length; i++) { if (mine[i] >= cp) { next = mine[i]; break; } }
      if (next === null) { txt += " · done"; }
      else if (next === cp) { el.innerHTML = esc(txt) + ' · <span class="up-now">YOU’RE UP</span>'; return; }
      else { txt += " · you in " + (next - cp); }
    } else {
      txt += " · set slot →";
    }
    el.textContent = txt;
  }

  function renderChips() {
    var el = document.getElementById("posChips");
    el.innerHTML = POS_ORDER.map(function (p) {
      return '<button class="chip" data-pos="' + p + '" aria-pressed="' + (state.posFilter === p) + '">' + p + "</button>";
    }).join("");
  }

  /* ---------- render: board ---------- */
  function playerRow(p) {
    var mark = state.drafted[p.id];
    var cls = "prow" + (mark === "gone" ? " gone" : "") + (mark === "mine" ? " mine-row" : "");
    var badges = "";
    if (p.valueVsAdp != null && p.valueVsAdp >= 8) badges += '<span class="badge value">VALUE</span>';
    if ((p.flags || []).indexOf("volatile") !== -1) badges += '<span class="badge warnb">±</span>';
    var inj = p.injury ? '<span class="inj-dot" title="' + esc(p.injury) + '"></span>' : "";
    var metaBits = [esc(p.team) + " · Bye " + (p.bye || "?")];
    if (p.yahooAdp != null) metaBits.push("ADP " + p.yahooAdp);
    if (p.injury) metaBits.push('<span style="color:var(--danger)">' + esc(p.injury) + "</span>");
    else if (p.note) metaBits.push(esc(p.note));
    var mineLabel = mark === "mine" ? "MINE ✓" : "＋MINE";
    return '<div class="' + cls + '" data-id="' + esc(p.id) + '" role="button" tabindex="0" aria-label="Mark ' + esc(p.name) + ' drafted">' +
      '<span class="rk num">' + p.rank + "</span>" +
      '<span class="pos-badge pos-' + esc(p.pos) + '">' + esc(p.pos) + (p.posRank || "") + "</span>" +
      '<span class="pinfo"><span class="pname">' + inj + '<span class="nm">' + esc(p.name) + "</span>" + badges + "</span>" +
      '<span class="pmeta">' + metaBits.join(" · ") + "</span></span>" +
      '<button class="mine-btn" data-mine="' + esc(p.id) + '" aria-label="Draft ' + esc(p.name) + ' to my team">' + mineLabel + "</button>" +
      "</div>";
  }
  var TIER_NOTES = {};
  function renderBoard() {
    var el = document.getElementById("view-board");
    var q = state.search.trim().toLowerCase();
    var list = D.players.slice().sort(function (a, b) { return a.rank - b.rank; });
    list = list.filter(function (p) {
      if (state.posFilter !== "ALL") {
        if (state.posFilter === "FLX") { if (["WR", "RB", "TE"].indexOf(p.pos) === -1) return false; }
        else if (p.pos !== state.posFilter) return false;
      }
      if (state.hideDrafted && state.drafted[p.id]) return false;
      if (q && (p.name + " " + p.team + " " + p.pos).toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
    if (!list.length) { el.innerHTML = '<div class="empty-note">No players match. Clear the search or filters.</div>'; return; }
    var html = "";
    if (q) {
      html = list.map(playerRow).join("");
    } else {
      var curTier = null;
      list.forEach(function (p) {
        var t = (p.pos === "K") ? "K" : (p.pos === "DEF") ? "DEF" : ("T" + (p.tier || "?"));
        if (t !== curTier) {
          curTier = t;
          var label = t === "K" ? "Kickers" : t === "DEF" ? "Defenses" : "Tier " + (p.tier || "?");
          var note = TIER_NOTES[t] ? '<span class="tl-note">' + esc(TIER_NOTES[t]) + "</span>" : "";
          html += '<div class="tier-label">' + label + note + "</div>";
        }
        html += playerRow(p);
      });
    }
    el.innerHTML = html;
  }

  /* ---------- render: roster ---------- */
  function rosterHTML() {
    var slots = computeRoster();
    var html = '<div class="roster-grid">';
    slots.forEach(function (s) {
      var p = s.player;
      html += '<div class="rslot' + (p ? " filled" : "") + '">' +
        '<span class="slot-key">' + s.def.label + "</span>";
      if (p) {
        html += '<span class="slot-player"><span class="pname"><span class="pos-badge pos-' + esc(p.pos) + '" style="width:auto;padding:2px 6px">' + esc(p.pos) + '</span> ' + esc(p.name) + '</span>' +
          '<span class="pmeta" style="color:var(--muted);font-size:12px">' + esc(p.team) + " · Bye " + (p.bye || "?") + "</span></span>" +
          '<button class="drop-btn" data-drop="' + esc(p.id) + '">✕</button>';
      } else {
        html += '<span class="slot-player"><span class="slot-empty">—</span></span>';
      }
      html += "</div>";
    });
    html += "</div>";

    var hints = [];
    var needs = rosterNeeds(slots);
    var cp = currentPick();
    var round = Math.min(ROUNDS, Math.ceil(cp / TEAMS));
    if (needs.length) hints.push({ cls: "", txt: "Still need: " + needs.join(", ") });
    var uniqueNeeds = needs.filter(function (n, i) { return needs.indexOf(n) === i; });
    if (round >= 5 && uniqueNeeds.indexOf("RB") !== -1 && needs.filter(function (n) { return n === "RB"; }).length >= 2) {
      hints.push({ cls: "alert", txt: "Both RB slots still open after Rd 4 — prioritize RB." });
    }
    var byeMap = {};
    slots.forEach(function (s) {
      if (s.player && s.def.key.indexOf("BN") === -1 && s.player.bye) {
        (byeMap[s.player.bye] = byeMap[s.player.bye] || []).push(s.player.name);
      }
    });
    Object.keys(byeMap).forEach(function (w) {
      if (byeMap[w].length >= 2) hints.push({ cls: "alert", txt: "Bye " + w + " collision (starters): " + byeMap[w].join(", ") });
    });
    if (hints.length) {
      html += '<div class="hint-box">' + hints.map(function (h) {
        return '<div class="hint ' + h.cls + '">' + esc(h.txt) + "</div>";
      }).join("") + "</div>";
    }
    html += '<button class="copy-btn" data-copy>📋 Copy status for Claude</button>';
    return html;
  }
  function renderRoster() {
    var html = '<h2 class="sec-head">My Roster</h2>' + rosterHTML();
    document.getElementById("view-roster").innerHTML = html;
    document.getElementById("sidebar").innerHTML = '<h2 class="sec-head">My Roster</h2>' + rosterHTML();
  }
  function copyStatus() {
    var slots = computeRoster();
    var lines = [];
    lines.push("GAMETIME draft status");
    lines.push("Slot: " + (state.slot || "?") + " · ~pick " + currentPick() + " of 180 · " + draftedCount() + " players marked drafted");
    lines.push("My roster:");
    slots.forEach(function (s) {
      lines.push("  " + s.def.label + ": " + (s.player ? s.player.name + " (" + s.player.pos + ", " + s.player.team + ", bye " + s.player.bye + ")" : "—"));
    });
    var needs = rosterNeeds(slots);
    if (needs.length) lines.push("Needs: " + needs.join(", "));
    var avail = D.players.filter(function (p) { return !state.drafted[p.id]; })
      .sort(function (a, b) { return a.rank - b.rank; }).slice(0, 10);
    lines.push("Best available on my board: " + avail.map(function (p, i) { return (i + 1) + ". " + p.name + " (" + p.pos + ")"; }).join("  "));
    var text = lines.join("\n");
    function done() { toast("Status copied — paste it to Claude"); }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); done(); } catch (e) { toast("Copy failed — select manually"); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else fallback();
  }

  /* ---------- render: strategy ---------- */
  function renderStrategy() {
    var el = document.getElementById("view-strategy");
    var html = '<h2 class="sec-head">Strategy</h2>';
    html += '<p class="sec-sub">' + esc(D.strategy.overview) + "</p>";
    html += '<h3 class="tier-label" style="margin-top:4px">Your draft slot</h3><div class="slot-picker">';
    for (var s = 1; s <= 12; s++) {
      html += '<button class="slot-btn num" data-slot="' + s + '" aria-pressed="' + (state.slot === s) + '">' + s + "</button>";
    }
    html += "</div>";
    if (state.slot) {
      var picks = picksForSlot(state.slot);
      html += '<div class="pick-strip">' + picks.map(function (p, i) {
        return '<span class="pick-pill num">R' + (i + 1) + " · <b>#" + p + "</b></span>";
      }).join("") + "</div>";
      var band = state.slot <= 3 ? "early" : state.slot <= 9 ? "mid" : "late";
      html += '<div class="hint" style="margin-bottom:12px">' + esc(D.strategy.bands[band]) + "</div>";
      html += (D.strategy.rounds || []).map(function (rc) {
        var pk = picks[rc.r - 1];
        var availTxt = "";
        var cands = D.players.filter(function (p) {
          return !state.drafted[p.id] && p.yahooAdp != null && p.yahooAdp >= pk - 4 && p.pos !== "K" && p.pos !== "DEF";
        }).sort(function (a, b) { return a.rank - b.rank; }).slice(0, 5);
        if (rc.r <= 12 && cands.length) {
          availTxt = '<div class="rc-avail">Likely there at #' + pk + ": " + cands.map(function (p) {
            return "<b>" + esc(p.name) + "</b> (" + esc(p.pos) + ")";
          }).join(", ") + "</div>";
        }
        return '<div class="round-card"><div class="rc-head"><span class="rc-round">ROUND ' + rc.r +
          '</span><span class="rc-pick num">pick #' + pk + "</span></div>" +
          '<div class="rc-advice">' + esc(rc.advice) + "</div>" + availTxt + "</div>";
      }).join("");
    } else {
      html += '<div class="empty-note">Pick your slot when the draft order is revealed — every pick number and round plan updates instantly.</div>';
    }
    el.innerHTML = html;
  }

  /* ---------- render: sheets ---------- */
  function sheetList(items, nameKey, whyKey) {
    if (!items || !items.length) return '<div class="sheet-item">Loads with the data refresh.</div>';
    return items.map(function (it) {
      return '<div class="sheet-item"><span class="si-name">' + esc(it[nameKey]) + "</span> " +
        '<span class="pos-badge pos-' + esc(it.pos || "") + '" style="width:auto;padding:2px 6px">' + esc(it.pos || "") + "</span> " +
        '<span style="color:var(--muted)">' + esc(it.team || "") + "</span>" +
        '<div class="si-why">' + esc(it[whyKey]) + "</div></div>";
    }).join("");
  }
  function renderSheets() {
    var el = document.getElementById("view-sheets");
    var mineTeams = {};
    state.mineOrder.forEach(function (id) { var p = byId[id]; if (p) mineTeams[p.team] = true; });
    var byeWeeks = {};
    Object.keys(D.byes).forEach(function (t) { (byeWeeks[D.byes[t]] = byeWeeks[D.byes[t]] || []).push(t); });
    var byeHtml = '<div class="bye-grid">' + Object.keys(byeWeeks).sort(function (a, b) { return a - b; }).map(function (w) {
      return '<div class="bye-cell"><span class="bw">Wk ' + w + "</span><br><span class=\"teams\">" +
        byeWeeks[w].sort().map(function (t) { return mineTeams[t] ? '<span class="mine-team">' + esc(t) + "</span>" : esc(t); }).join(" · ") +
        "</span></div>";
    }).join("") + "</div>";

    var cuffs = (D.handcuffs || []);
    var cuffHtml = cuffs.length
      ? '<div class="tbl-wrap"><table class="tbl"><tr><th>Starter</th><th>Handcuff</th><th>Team</th><th>Note</th></tr>' +
        cuffs.map(function (c) {
          return "<tr><td>" + esc(c.starter) + "</td><td>" + esc(c.backup) + "</td><td>" + esc(c.team) + "</td><td>" + esc(c.note || "") + "</td></tr>";
        }).join("") + "</table></div>"
      : '<div class="sheet-item">Loads with the data refresh.</div>';

    function posSheet(pos) {
      var rows = D.players.filter(function (p) { return p.pos === pos; })
        .sort(function (a, b) { return a.rank - b.rank; });
      if (!rows.length) return '<div class="sheet-item">Loads with the data refresh.</div>';
      return rows.map(function (p) {
        var gone = state.drafted[p.id] ? ' style="text-decoration:line-through;opacity:.55"' : "";
        return '<div class="sheet-item"' + gone + '><span class="si-name">' + (p.posRank || "") + ". " + esc(p.name) + "</span> " +
          '<span style="color:var(--muted)">' + esc(p.team) + " · Bye " + (p.bye || "?") + "</span>" +
          (p.note ? '<div class="si-why">' + esc(p.note) + "</div>" : "") + "</div>";
      }).join("");
    }

    el.innerHTML = '<h2 class="sec-head">Cheat Sheets</h2>' +
      '<details class="acc" open><summary>💤 Sleepers</summary><div class="acc-body">' + sheetList(D.sleepers, "name", "reason") + "</div></details>" +
      '<details class="acc"><summary>🚩 Busts / avoid at price</summary><div class="acc-body">' + sheetList(D.busts, "name", "reason") + "</div></details>" +
      '<details class="acc"><summary>🌱 Rookies to know</summary><div class="acc-body">' + sheetList(D.rookies, "name", "outlook") + "</div></details>" +
      '<details class="acc"><summary>🔗 Handcuffs</summary><div class="acc-body">' + cuffHtml + "</div></details>" +
      '<details class="acc"><summary>📅 Bye weeks <span style="font-weight:500;color:var(--muted);font-size:13px">(your teams highlighted)</span></summary><div class="acc-body">' + byeHtml + "</div></details>" +
      '<details class="acc"><summary>🦵 Kickers</summary><div class="acc-body">' + posSheet("K") + "</div></details>" +
      '<details class="acc"><summary>🛡 Defenses</summary><div class="acc-body">' + posSheet("DEF") +
        '<div class="hint" style="margin-top:8px">' + esc(D.streaming || "") + "</div></div></details>";
  }

  /* ---------- render: league ---------- */
  function renderLeague() {
    var el = document.getElementById("view-league");
    el.innerHTML = '<h2 class="sec-head">League — IT’S GAMETIME BABY!!!</h2>' +
      '<div class="league-card"><h3>THE SHAPE</h3><ul>' +
      "<li>12 teams · snake · <b>1-minute pick clock</b> · Fri Sep 4, 9:00pm EDT</li>" +
      "<li>Start: QB · WR · WR · RB · RB · TE · W/R/T flex · K · DEF + 6 bench (+ IR)</li>" +
      "<li><b>15 rounds, 180 picks.</b> Playoffs: 8 of 12 make it, weeks 15–17</li>" +
      "</ul></div>" +
      '<div class="league-card"><h3>SCORING</h3><div class="tbl-wrap"><table class="tbl">' +
      "<tr><th>Category</th><th>Points</th></tr>" +
      "<tr><td>Reception (full PPR)</td><td><b>1</b></td></tr>" +
      "<tr><td>Passing TD</td><td><b>6</b> (Yahoo default is 4!)</td></tr>" +
      "<tr><td>Passing yards</td><td>1 per 25</td></tr>" +
      "<tr><td>Rush/receiving yards</td><td>1 per 10</td></tr>" +
      "<tr><td>Rush/receiving TD</td><td>6</td></tr>" +
      "<tr><td>Interception thrown</td><td>−1</td></tr>" +
      "<tr><td>Fumble lost</td><td>−2</td></tr>" +
      "<tr><td>2-pt conversion</td><td>2</td></tr>" +
      "<tr><td>FG 0–39 / 40–49 / 50+</td><td>3 / 4 / <b>5</b></td></tr>" +
      "<tr><td>PAT</td><td>1</td></tr>" +
      "<tr><td>DEF: sack 1 · INT 2 · fum rec 2 · TD 6 · safety 2 · block 2</td><td></td></tr>" +
      "<tr><td>DEF points allowed: 0 → 10 · 1–6 → 7 · 7–13 → 4 · 14–20 → 1 · 21–27 → 0 · 28–34 → −1 · 35+ → −4</td><td></td></tr>" +
      "</table></div></div>" +
      '<div class="league-card"><h3>WHAT IT MEANS</h3><ul>' +
      "<li><b>6-pt passing TDs</b>: QBs score ~15–20% more than the default rankings your leaguemates are drafting from. Elite QBs are worth taking a round or two earlier than ADP — that's your biggest edge.</li>" +
      "<li><b>Full PPR</b>: target hogs and pass-catching RBs move up; two-down grinders move down.</li>" +
      "<li><b>8 of 12 make playoffs</b>: draft for ceiling — a top-heavy roster beats a deep-but-mediocre one.</li>" +
      "<li><b>5-pt 50+ FGs</b>: prefer big-leg kickers on good offenses; still draft K and DEF in the last two rounds.</li>" +
      "<li><b>1-minute clock</b>: use this board — tap a player the moment he's taken so Best Available stays honest.</li>" +
      "</ul></div>" +
      '<div class="league-card"><h3>DATA</h3>' +
      '<p class="stamp">Data as of: <b>' + esc(D.meta.dataAsOf) + "</b><br>Scoring model: " + esc(D.meta.scoring) +
      (D.meta.sources && D.meta.sources.length ? "<br>Sources: " + D.meta.sources.map(esc).join(", ") : "") + "</p></div>" +
      '<button class="reset-btn" data-reset>Reset draft (clears all marks)</button>';
  }

  /* ---------- render: tabs & views ---------- */
  function renderTabs() {
    var el = document.getElementById("tabbar");
    el.innerHTML = TABS.map(function (t) {
      return '<button class="tab-btn" data-tab="' + t.key + '" aria-pressed="' + (state.view === t.key) + '">' +
        '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + t.icon + '"/></svg>' + t.label + "</button>";
    }).join("");
  }
  function setView(v) {
    state.view = v;
    document.querySelectorAll(".view").forEach(function (sec) {
      sec.classList.toggle("active", sec.id === "view-" + v);
    });
    renderTabs();
    saveState();
    window.scrollTo(0, 0);
  }
  function renderDynamic() {
    renderTracker();
    renderBoard();
    renderRoster();
    renderStrategy();
    renderSheets();
    renderLeague();
  }

  /* ---------- events ---------- */
  document.addEventListener("click", function (ev) {
    var t = ev.target;
    var mineBtn = t.closest && t.closest("[data-mine]");
    if (mineBtn) { ev.stopPropagation(); markPlayer(mineBtn.getAttribute("data-mine"), "mine"); toast("On your team"); return; }
    var row = t.closest && t.closest(".prow[data-id]");
    if (row) {
      var id = row.getAttribute("data-id");
      if (state.drafted[id]) markPlayer(id, null);   // tap a struck row to restore
      else markPlayer(id, "gone");
      return;
    }
    var drop = t.closest && t.closest("[data-drop]");
    if (drop) { markPlayer(drop.getAttribute("data-drop"), null); toast("Released"); return; }
    var chip = t.closest && t.closest(".chip[data-pos]");
    if (chip) { state.posFilter = chip.getAttribute("data-pos"); saveState(); renderChips(); renderBoard(); return; }
    var tab = t.closest && t.closest("[data-tab]");
    if (tab) { setView(tab.getAttribute("data-tab")); return; }
    var slotBtn = t.closest && t.closest("[data-slot]");
    if (slotBtn) { state.slot = parseInt(slotBtn.getAttribute("data-slot"), 10); saveState(); renderDynamic(); return; }
    if (t.closest && t.closest("[data-copy]")) { copyStatus(); return; }
    if (t.closest && t.closest("[data-reset]")) { resetDraft(); return; }
    if (t.id === "undoBtn") { undo(); return; }
  });
  document.addEventListener("keydown", function (ev) {
    var row = ev.target.closest && ev.target.closest(".prow[data-id]");
    if (row && (ev.key === "Enter" || ev.key === " ")) {
      ev.preventDefault();
      var id = row.getAttribute("data-id");
      if (state.drafted[id]) markPlayer(id, null); else markPlayer(id, "gone");
      return;
    }
    if (ev.key === "/" && document.activeElement !== searchEl) { ev.preventDefault(); searchEl.focus(); return; }
    if (ev.key === "Escape") { searchEl.value = ""; state.search = ""; renderBoard(); searchEl.blur(); return; }
    if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "z") { ev.preventDefault(); undo(); return; }
    if (ev.key.toLowerCase() === "u" && document.activeElement !== searchEl && !ev.ctrlKey && !ev.metaKey) { undo(); }
  });
  var searchEl = document.getElementById("search");
  var searchTimer = null;
  searchEl.addEventListener("input", function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () { state.search = searchEl.value; renderBoard(); }, 80);
  });
  var hideEl = document.getElementById("hideDrafted");
  hideEl.addEventListener("change", function () { state.hideDrafted = hideEl.checked; saveState(); renderBoard(); });

  /* ---------- boot ---------- */
  loadState();
  showStorageBanner();
  document.getElementById("placeholderBanner").hidden = !D.meta.placeholder;
  hideEl.checked = state.hideDrafted;
  renderChips();
  renderDynamic();
  setView(state.view);
})();
</script>
